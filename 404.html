<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; Ronovo</title>
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #15171c;
    --panel: #1d2027;
    --border: #2f3440;
    --text: #e9ecf2;
    --muted: #a1a8b8;
    --accent: #7fb2ff;
    --link: #7fb2ff;
    --on-accent: #0d1b33;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #dde1e8;
      --text: #1d2129;
      --muted: #5c6475;
      --accent: #2463c9;
      --link: #2463c9;
      --on-accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .box {
    max-width: 440px;
    width: 100%;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 24px;
  }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0 0 22px; color: var(--muted); }
  a.btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>That page doesn't exist. Head back to the home page.</p>
    <a class="btn" href="/">Back home</a>
  </div>
</body>
</html>
